services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RELAYDESK_POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      RELAYDESK_DB_NAME: relaydesk
      RELAYDESK_MIGRATE_PASSWORD: ${RELAYDESK_MIGRATE_PASSWORD:?}
      RELAYDESK_RUNTIME_PASSWORD: ${RELAYDESK_RUNTIME_PASSWORD:?}
      RELAYDESK_APP_PASSWORD: ${RELAYDESK_APP_PASSWORD:?}
      RELAYDESK_AUTH_PASSWORD: ${RELAYDESK_AUTH_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relaydesk"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:59432:5432"]
  nats:
    image: nats:2.12.4-alpine3.22@sha256:31c6ed3b2da61645aaa3ad9217b5a52b34b6ebd555ecb71259cd7723c59ae1ea
    command: ["--jetstream", "--store_dir", "/data"]
    volumes: ["natsdata:/data"]
    ports: ["127.0.0.1:59422:4222"]
  redis:
    image: redis:8.2.10-alpine3.22@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:59679:6379"]
  migrate:
    build:
      context: ../..
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${RELAYDESK_MIGRATION_DATABASE_URL:?}
      GOOSE_MIGRATION_DIR: /app/migrations
    entrypoint: ["/app/goose"]
    command: ["up"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
volumes:
  pgdata:
  natsdata:
  redisdata:
